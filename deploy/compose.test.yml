name: api-truth-test

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: "no"
    environment:
      POSTGRES_DB: api_truth_test
      POSTGRES_USER: api_truth_test
      POSTGRES_PASSWORD: synthetic-only
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s
    labels:
      dev.api-truth.purpose: isolated-test-only
      dev.api-truth.credentials: synthetic-not-for-production

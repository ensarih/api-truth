swagger: '2.0'
info:
  title: Orders
  version: '1.0.0'
basePath: /gateway/v1
produces:
  - application/json
paths:
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        type: string
    get:
      operationId: getOrder
      responses:
        '200':
          description: Order found
          schema:
            $ref: '#/definitions/Order'
definitions:
  Order:
    type: object
    required:
      - id
    properties:
      id:
        type: string

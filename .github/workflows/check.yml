name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.6.0"
          test "$(npm --version)" = "11.5.1"
      - run: npm ci
      - run: npm run check

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Start isolated PostgreSQL
        run: npm run test:env:up
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Stop isolated PostgreSQL
        if: always()
        run: npm run test:env:down

  swagger-runtime-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/conformance/swagger-runtime/package-lock.json
      - run: npm ci
      - name: Install isolated locked framework fixtures
        run: npm --prefix tests/conformance/swagger-runtime ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned fixture Node runtime
        run: npm --prefix tests/conformance/swagger-runtime rebuild node --foreground-scripts
      - name: Check runtime behavior and analyzer boundaries
        run: npm run test:swagger:runtime

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
          cache: npm
      - name: Install locked dependencies and browser
        run: |
          test "$(node --version)" = "v24.6.0"
          test "$(npm --version)" = "11.5.1"
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Run portal browser tests
        run: |
          browser_path="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          test -x "$browser_path"
          API_TRUTH_BROWSER_EXECUTABLE="$browser_path" npm run test:browser
